# Netlify build configuration.
# Settings here take precedence over the build settings in the Netlify UI,
# so the deploy no longer depends on the UI's "yarn build" command.
# This is a plain Hugo site: no Node, npm or yarn is needed to build it.

[build]
  publish = "public"
  command = "hugo --gc --minify"

[build.environment]
  # Netlify downloads this exact Hugo release at build time.
  # Keep in sync with the version noted in README.md.
  HUGO_VERSION = "0.166.0"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

# Basic hardening headers. These do not affect the Decap CMS admin
# (same origin) or the Netlify Identity widget (loaded into our page).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The CMS admin must never be indexed.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
